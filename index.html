<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investor Research Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────── */
:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --card:     #1c2333;
  --card2:    #21293a;
  --border:   #30363d;
  --border2:  #3d4a5c;
  --tx:       #e6edf3;
  --tx2:      #8b949e;
  --tx3:      #6e7681;
  --ac:       #58a6ff;
  --ac2:      #79c0ff;
  --acg:      linear-gradient(135deg,#4c8ef7,#a371f7);
  --acg2:     linear-gradient(135deg,#79c0ff,#d2a8ff);
  --ok:       #3fb950;
  --err:      #f85149;
  --warn:     #d29922;
  --r:        14px;
  --r2:       10px;
  --shadow:   0 8px 32px rgba(0,0,0,.45);
  --shadow2:  0 2px 8px rgba(0,0,0,.3);
  --glow:     0 0 20px rgba(88,166,255,.2);
  color-scheme: dark;
}

/* ── RESET & BASE ───────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--tx);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}

/* ── ANIMATED BACKGROUND ────────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(88,166,255,.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(163,113,247,.07) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 60% 30%, rgba(63,185,80,.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
  max-width: 700px;
  margin: 0 auto;
  padding: 28px 18px 80px;
}

/* ── PAGE TRANSITION ────────────────────────────────── */
.page-enter {
  animation: pageIn .35s cubic-bezier(.22,.68,0,1.2) both;
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(24px) scale(.98); }
  to   { opacity: 1; transform: none; }
}

/* ── LANDING HERO ───────────────────────────────────── */
.hero {
  text-align: center;
  padding: 60px 0 40px;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(88,166,255,.12);
  border: 1px solid rgba(88,166,255,.25);
  border-radius: 100px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ac2);
  letter-spacing: .04em;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.hero-badge span { font-size: 14px; }
.hero h1 {
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 800;
  line-height: 1.15;
  background: var(--acg2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 18px;
}
.hero p {
  max-width: 520px;
  margin: 0 auto 32px;
  color: var(--tx2);
  font-size: 15px;
  line-height: 1.7;
}
.hero-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-bottom: 36px;
  flex-wrap: wrap;
}
.stat {
  text-align: center;
}
.stat strong {
  display: block;
  font-size: 22px;
  font-weight: 700;
  color: var(--tx);
}
.stat span {
  font-size: 12px;
  color: var(--tx3);
  text-transform: uppercase;
  letter-spacing: .06em;
}

/* ── BUTTONS ────────────────────────────────────────── */
.btn-primary {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--acg);
  color: #fff;
  border: none;
  border-radius: 100px;
  padding: 14px 32px;
  font: 600 15px 'Inter', sans-serif;
  cursor: pointer;
  overflow: hidden;
  transition: transform .2s, box-shadow .2s;
  box-shadow: 0 4px 20px rgba(88,166,255,.3);
}
.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.15) 50%, transparent 100%);
  transform: translateX(-100%);
  transition: transform .5s;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(88,166,255,.4); }
.btn-primary:hover::after { transform: translateX(100%); }
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  color: var(--tx2);
  border: 1px solid var(--border2);
  border-radius: 100px;
  padding: 12px 22px;
  font: 500 14px 'Inter', sans-serif;
  cursor: pointer;
  transition: all .2s;
}
.btn-secondary:hover { border-color: var(--ac); color: var(--ac); background: rgba(88,166,255,.06); }

.btn-small {
  background: rgba(88,166,255,.1);
  border: 1px solid rgba(88,166,255,.2);
  color: var(--ac2);
  border-radius: 8px;
  padding: 5px 12px;
  font: 500 12px 'Inter', sans-serif;
  cursor: pointer;
  transition: all .18s;
  white-space: nowrap;
}
.btn-small:hover { background: rgba(88,166,255,.2); border-color: var(--ac); }

/* ── SECTION HEADER ─────────────────────────────────── */
.section-header {
  margin-bottom: 24px;
}
.section-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--tx3);
  margin-bottom: 8px;
}
.section-label::before {
  content: '';
  display: inline-block;
  width: 16px;
  height: 2px;
  background: var(--acg);
  border-radius: 2px;
}
.section-header h1 {
  font-size: clamp(20px, 4vw, 26px);
  font-weight: 700;
  color: var(--tx);
  line-height: 1.3;
}

/* ── PROGRESS ───────────────────────────────────────── */
.progress-wrap {
  margin-bottom: 28px;
}
.progress-steps {
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 12px;
}
.progress-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  position: relative;
}
.progress-step:not(:last-child)::after {
  content: '';
  position: absolute;
  top: 14px;
  left: 50%;
  width: 100%;
  height: 2px;
  background: var(--border);
  z-index: 0;
  transition: background .4s;
}
.progress-step.done:not(:last-child)::after { background: var(--ac); }
.step-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--tx3);
  position: relative;
  z-index: 1;
  transition: all .3s;
}
.progress-step.active .step-dot {
  border-color: var(--ac);
  background: rgba(88,166,255,.15);
  color: var(--ac);
  box-shadow: var(--glow);
}
.progress-step.done .step-dot {
  border-color: var(--ok);
  background: rgba(63,185,80,.15);
  color: var(--ok);
}
.step-label {
  font-size: 10px;
  color: var(--tx3);
  margin-top: 5px;
  text-align: center;
  transition: color .3s;
  white-space: nowrap;
}
.progress-step.active .step-label { color: var(--ac); font-weight: 600; }
.progress-step.done .step-label { color: var(--ok); }

.progress-bar-outer {
  height: 4px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar-inner {
  height: 100%;
  background: var(--acg);
  border-radius: 4px;
  transition: width .5s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.progress-bar-inner::after {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 60px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.4));
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer { from { opacity: 0; } 50% { opacity: 1; } to { opacity: 0; } }

/* ── QUESTION CARD ──────────────────────────────────── */
.q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px;
  margin-bottom: 14px;
  transition: border-color .2s, box-shadow .2s;
  animation: cardIn .3s ease both;
}
.q-card:focus-within {
  border-color: var(--border2);
  box-shadow: var(--shadow2);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.q-label {
  font-size: 15px;
  font-weight: 600;
  color: var(--tx);
  margin-bottom: 14px;
  line-height: 1.45;
  display: flex;
  gap: 6px;
}
.q-label .req-dot {
  color: var(--ac);
  font-weight: 800;
  flex-shrink: 0;
}

/* ── RADIO / CHECKBOX OPTIONS ───────────────────────── */
.opt-list { display: flex; flex-direction: column; gap: 6px; }

.opt-label {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r2);
  cursor: pointer;
  transition: all .18s;
  background: var(--card2);
  position: relative;
  overflow: hidden;
}
.opt-label:hover {
  border-color: var(--border2);
  background: rgba(88,166,255,.05);
}
.opt-label input { display: none; }

.opt-indicator {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid var(--border2);
  flex-shrink: 0;
  position: relative;
  transition: all .18s;
  background: transparent;
}
.opt-indicator.sq { border-radius: 5px; }

.opt-label input:checked ~ .opt-indicator {
  border-color: var(--ac);
  background: var(--ac);
}
.opt-label input:checked ~ .opt-indicator::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(1);
  width: 6px; height: 6px;
  background: #fff;
  border-radius: 50%;
}
.opt-indicator.sq::after {
  width: 9px !important; height: 7px !important;
  border-radius: 0 !important;
  background: transparent !important;
  border-bottom: 2px solid #fff;
  border-right: 2px solid #fff;
  transform: translate(-50%,-60%) rotate(45deg) !important;
  top: 50%; left: 50%;
}

.opt-text {
  font-size: 14px;
  color: var(--tx2);
  transition: color .18s;
  line-height: 1.4;
}
.opt-label input:checked ~ .opt-indicator + .opt-text,
.opt-label:has(input:checked) .opt-text {
  color: var(--tx);
  font-weight: 500;
}
.opt-label:has(input:checked) {
  border-color: var(--ac);
  background: rgba(88,166,255,.08);
}
.opt-label:has(input:checked)::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--acg);
  border-radius: 3px 0 0 3px;
}

/* ── TEXT INPUT ─────────────────────────────────────── */
.text-input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r2);
  background: var(--card2);
  color: var(--tx);
  font: 14px 'Inter', sans-serif;
  transition: border-color .2s, box-shadow .2s;
  outline: none;
}
.text-input::placeholder { color: var(--tx3); }
.text-input:focus {
  border-color: var(--ac);
  box-shadow: 0 0 0 3px rgba(88,166,255,.12);
}

/* ── SWITCH PILLS ───────────────────────────────────── */
.switch-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 6px;
  padding: 14px 16px;
  background: rgba(88,166,255,.04);
  border: 1px solid rgba(88,166,255,.1);
  border-radius: var(--r2);
}
.switch-row p {
  font-size: 13px;
  color: var(--tx3);
  margin: 0;
  flex: 1;
  min-width: 160px;
}

/* ── FORM ACTIONS ───────────────────────────────────── */
.form-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 20px;
}

/* ── ERROR ──────────────────────────────────────────── */
.error-msg {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--err);
  font-size: 13px;
  font-weight: 500;
  padding: 10px 14px;
  background: rgba(248,81,73,.08);
  border: 1px solid rgba(248,81,73,.2);
  border-radius: 8px;
  margin: 12px 0;
  display: none;
}
.error-msg.visible { display: flex; }

/* ── SAVING SCREEN ──────────────────────────────────── */
.saving-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 50vh;
  text-align: center;
  gap: 20px;
}
.spinner {
  width: 44px; height: 44px;
  border: 3px solid var(--border);
  border-top-color: var(--ac);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── THANK YOU SCREEN ───────────────────────────────── */
.thankyou {
  text-align: center;
  padding: 60px 20px;
}
.thankyou-icon {
  width: 72px; height: 72px;
  background: linear-gradient(135deg,rgba(63,185,80,.2),rgba(63,185,80,.05));
  border: 2px solid rgba(63,185,80,.4);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin: 0 auto 24px;
  animation: popIn .5s cubic-bezier(.22,.68,0,1.6) .1s both;
}
@keyframes popIn {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
.thankyou h1 {
  font-size: 32px;
  font-weight: 800;
  background: var(--acg2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px;
}
.thankyou .ok-msg {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ok);
  font-size: 14px;
  font-weight: 600;
  background: rgba(63,185,80,.1);
  border: 1px solid rgba(63,185,80,.25);
  padding: 10px 20px;
  border-radius: 100px;
  margin-bottom: 20px;
}
.thankyou p {
  color: var(--tx2);
  font-size: 15px;
  max-width: 400px;
  margin: 0 auto;
}

/* fallback copy area */
pre {
  white-space: pre-wrap;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 14px;
  font-size: 13px;
  color: var(--tx2);
  text-align: left;
  margin: 20px 0;
  font-family: 'SF Mono', 'Fira Code', monospace;
}

/* ── RESPONSIVE ─────────────────────────────────────── */
@media (max-width: 480px) {
  #app { padding: 20px 14px 60px; }
  .hero { padding: 40px 0 28px; }
  .hero-stats { gap: 20px; }
  .progress-steps { gap: 0; }
  .step-label { font-size: 9px; }
}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ── DATA ──────────────────────────────────────────────────── */
const COMMON=[
 {id:"invested",h:"H4",t:"Have you ever invested in stocks or mutual funds?",k:"single",o:["Never, but I want to start","Tried once or twice","I invest occasionally","I invest regularly"],req:1},
 {id:"goal",h:"H8, H9",t:"What do you mainly want from company research?",k:"single",o:["Judge the right time and price to buy","Broaden my perspective beyond what I already follow"],req:1,showIf:a=>a.invested&&a.invested!=="Never, but I want to start"},
 {id:"where",h:"H1, H2",t:"Where do you get information about companies and investing today? (tick all that apply)",k:"multi",o:["YouTube or Instagram","Friends or family","Telegram or WhatsApp groups","Broker or analyst reports","Company annual reports","ChatGPT or other AI","Nowhere yet"]},
 {id:"report",h:"H2",t:"Have you ever opened a company's annual report or a research report?",k:"single",o:["Never","Opened one, couldn't understand it","Read some parts","I read them regularly"]},
 {id:"diff",h:"H2, H3",t:"What is your biggest difficulty with company information?",k:"single",o:["Jargon, I don't understand it","It's too long","I don't know what to look for","I can't tell if it's reliable or biased","I don't find it difficult"]},
 {id:"learnpref",h:"H5",t:"To understand a company report, which would you prefer?",k:"single",o:["Read it on my own","A video where an industry professional walks me through it","A short AI summary","The report plus an expert video, with help when I'm stuck"]},
 {id:"video",h:"H6",t:"Would a video walkthrough by an industry professional make you more likely to read the actual report?",k:"single",o:["Yes, much more","Somewhat","No, I'd just watch the video","No, I'd rather read directly"]}
];
const SHARED=[
 {id:"sources",h:"H1",t:"Last time you researched a company, how many different places did you check?",k:"single",o:["I didn't research","1","2-3","4-5","6 or more"]},
 {id:"check",h:"H3",t:"How do you check whether a report or recommendation is reliable? (tick all that apply)",k:"multi",o:["Who wrote it and how they earn","Their past track record","Compare with another source","Check the numbers myself","I don't check"]},
 {id:"takeaways",h:"H8",t:"After an expert explains a report, what would you rather get?",k:"single",o:["One clear verdict","Several takeaways (bull view, bear view, risks) so I decide","Both"]},
 {id:"aistuck",h:"H7",t:"When you're stuck on a report, what do you do today? (tick all that apply)",k:"multi",o:["Ask a friend or family","Search Google or YouTube","Ask ChatGPT or other AI","Ask an adviser","Skip it and move on"]}
];
const PRICE=[
 {id:"spend",h:"H10, H11",t:"Today, how much do you spend per month on investing tools, courses or paid advice?",k:"single",o:["Nothing","Under ₹500","₹500-2,000","Over ₹2,000"]},
 {id:"price",h:"H10",t:"Which monthly price would you actually pay for a platform like this (not just say)?",k:"single",o:["Nothing, only if free","₹99","₹199","₹299","₹499","More than ₹499"],req:1},
 {id:"start",h:"H12",t:"How would you start?",k:"single",o:["Free first, upgrade if it helps me","Pay right away if it looks good","Only if fully free"]},
 {id:"wait",h:"H10",t:"The platform is not built yet. Want to be on the early-access list?",k:"single",o:["Yes","Maybe","No"],req:1},
 {id:"contact",t:"Optional: WhatsApp number or email for early access and a 10-minute chat.",k:"line"}
];
const CATS={
 beginner:{name:"Beginner",icon:"🌱",line:"you haven't invested yet and the technical side is holding you back",
  qs:[{id:"b_stop",h:"H4",t:"What is the MAIN thing holding you back?",k:"single",o:["The terms and jargon confuse me","I don't know how to read information about a company","I don't know how to choose which company","I'm afraid of losing money by misjudging","I don't know how to open or use an account","I have no one to ask"]},
      {id:"b_explain",h:"H4",t:"If you opened a company report, what would you most need explained? (tick all that apply)",k:"multi",o:["Financial terms","Profit and loss numbers","Whether the company is actually good","The risks","How it compares to other companies"]},
      {id:"b_ready",h:"H4, H7",t:"What would make you confident enough to make your first investment?",k:"single",o:["Understanding a company's report myself","Following a step-by-step learning path","Starting with a very small amount","Advice from someone I trust","Seeing others' results"]},
      {id:"b_way",h:"H5, H7",t:"How would you prefer to learn?",k:"single",o:["The report plus an expert video, step by step","Asking an AI whenever I'm stuck","Short daily lessons","Someone just telling me what to buy"]},
      {id:"b_course",h:"H7",t:"Have you ever started an investing course or video series?",k:"single",o:["Finished it","Started but didn't finish","Never started one"]},
      {id:"b_ai",h:"H7",t:"If you got stuck on a report, what would you want from an AI companion? (tick all that apply)",k:"multi",o:["Explain terms in simple language","Show the page in the report it is based on","Say when it is unsure","Point me back to the right part of the report","I'd rather ask a person"]},
      {id:"b_take",h:"H8",t:"After an expert explains a report, what would you rather get?",k:"single",o:["One clear verdict","Several takeaways (bull view, bear view, risks) so I decide","Both"]}]},
 seeker:{name:"Timing / Price Seeker",icon:"📈",line:"you invest and want to judge the right time and price",
  qs:[{id:"s_rely",h:"H8",t:"To judge whether a price is right, what do you rely on today? (tick all that apply)",k:"multi",o:["Tips or news","Charts","Valuation ratios (like P/E)","Analyst target prices","Gut feeling","An adviser's call"]},
      {id:"s_pick",h:"H8",t:"Which would you actually use?",k:"single",o:["A target price from an analyst","A tool showing how analysts reached their price, where I can change the assumptions","Both","Neither"]},
      {id:"s_call",h:"H8",t:"If a platform never said 'buy' or 'sell' but taught you to judge price yourself, would that be enough?",k:"single",o:["Yes, enough","I'd still want a clear call","Depends"]},...SHARED]},
 seasoned:{name:"Seasoned Investor",icon:"🏆",line:"you're experienced and want to broaden your perspective",
  qs:[{id:"e_sector",h:"H9",t:"In the last month, how many reports from sectors outside your usual ones did you read?",k:"single",o:["None","1-2","3-5","6 or more"]},
      {id:"e_bear",h:"H9",t:"How often do you read a strong bear case against a stock you own?",k:"single",o:["Never","Rarely","Sometimes","Always"]},
      {id:"e_weekly",h:"H9",t:"Would you check a bull-vs-bear comparison of reports every week?",k:"single",o:["Yes, weekly","Occasionally","No"]},...SHARED]}
};

const HT={};
[...COMMON,...SHARED,...PRICE,...Object.values(CATS).flatMap(c=>c.qs)].forEach(q=>{if(q.h)HT[q.id]=q.h});

const app = document.getElementById("app");
let cat = null, ans = {};

const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const routeCat = a => a.invested==="Never, but I want to start" ? "beginner" : (a.goal&&a.goal.startsWith("Judge") ? "seeker" : "seasoned");

/* ── ENDPOINT ──────────────────────────────────────────────── */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxA6hIv1d-LwbaIFtbNQp4Fwcnrd7qp531MQIAeiPezfIFkPgsiSKIhL_bdD0YFvZRj/exec";

/* ── SAVE ──────────────────────────────────────────────────── */
async function save(rec) {
  if (!ENDPOINT) return false;
  try {
    await fetch(ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(rec),
    });
    return true;
  } catch(e) { return false; }
}

/* ── RENDER HELPERS ────────────────────────────────────────── */
function enter() {
  app.querySelector('.page-enter') || app.firstElementChild?.classList.add('page-enter');
  // Apply to wrapper div
  const w = app.firstElementChild;
  if (w) { w.classList.remove('page-enter'); void w.offsetWidth; w.classList.add('page-enter'); }
}

function progressHTML(step, pct) {
  const labels = ["About you","Your experience","Pricing"];
  return `
  <div class="progress-wrap">
    <div class="progress-steps">
      ${[0,1,2].map(i=>`
        <div class="progress-step ${i<step?'done':i===step?'active':''}">
          <div class="step-dot">${i<step?'✓':(i+1)}</div>
          <div class="step-label">${labels[i]}</div>
        </div>`).join('')}
    </div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="pb" style="width:${pct}%"></div>
    </div>
  </div>`;
}

function fieldHTML(q) {
  const label = `<div class="q-label">${esc(q.t)}${q.req?'<span class="req-dot">*</span>':''}</div>`;
  if (q.k === "line") return `
    <div class="q-card" data-id="${q.id}">
      ${label}
      <input class="text-input" type="text" name="${q.id}" placeholder="Type here…">
    </div>`;
  const type = q.k === "multi" ? "checkbox" : "radio";
  const ind = type === "checkbox" ? "sq" : "";
  return `
    <div class="q-card" data-id="${q.id}">
      ${label}
      <div class="opt-list">
        ${q.o.map(o=>`
          <label class="opt-label">
            <input type="${type}" name="${q.id}" value="${esc(o)}">
            <div class="opt-indicator ${ind}"></div>
            <span class="opt-text">${esc(o)}</span>
          </label>`).join('')}
      </div>
    </div>`;
}

/* ── PAGE RENDERER ─────────────────────────────────────────── */
function page({title, sublabel="", note="", list, step, pct=0, label, onBack, onNext}) {
  app.innerHTML = `<div class="page-enter">
    <div class="section-header">
      <div class="section-label">${sublabel||(['Step 1 of 3','Step 2 of 3','Step 3 of 3'][step]||'')}</div>
      <h1>${title}</h1>
    </div>
    ${progressHTML(step, pct)}
    ${note}
    <form id="f" novalidate>
      ${list.map(fieldHTML).join('')}
      <div class="error-msg" id="err">⚠ Please answer the questions marked *.</div>
      <div class="form-actions">
        ${onBack?`<button type="button" class="btn-secondary" id="back">← Back</button>`:''}
        <button type="submit" class="btn-primary">${label} →</button>
      </div>
    </form>
  </div>`;

  const f = document.getElementById("f");

  // Restore saved answers
  list.forEach(q => {
    const v = ans[q.id];
    if (v == null || v === "") return;
    f.querySelectorAll(`[name=${q.id}]`).forEach(el => {
      if (el.type === "checkbox") el.checked = v.includes(el.value);
      else if (el.type === "radio") el.checked = el.value === v;
      else el.value = v;
    });
  });

  const read = () => {
    const o = {};
    list.forEach(q => {
      const els = f.querySelectorAll(`[name=${q.id}]`);
      if (q.k === "multi") o[q.id] = [...els].filter(x=>x.checked).map(x=>x.value);
      else if (q.k === "line") o[q.id] = els[0].value.trim();
      else { const x = [...els].find(x=>x.checked); o[q.id] = x ? x.value : ""; }
    });
    return o;
  };

  const vis = q => !q.showIf || q.showIf({...ans, ...read()});

  const upd = () => {
    const o = read();
    let n = 0, m = 0;
    list.forEach(q => {
      const el = f.querySelector(`[data-id=${q.id}]`);
      const v = vis(q);
      el.style.display = v ? "" : "none";
      if (v) { m++; if (Array.isArray(o[q.id]) ? o[q.id].length : o[q.id]) n++; }
    });
    const newPct = Math.round(((step + (m ? n/m : 0)) / 3) * 100);
    const bar = document.getElementById("pb");
    if (bar) bar.style.width = newPct + "%";
  };

  f.addEventListener("input", upd);
  f.addEventListener("change", upd);
  upd();

  if (onBack) document.getElementById("back").onclick = onBack;

  f.onsubmit = e => {
    e.preventDefault();
    const o = read();
    const errEl = document.getElementById("err");
    if (list.some(q => vis(q) && q.req && (Array.isArray(o[q.id]) ? !o[q.id].length : !o[q.id]))) {
      errEl.classList.add('visible');
      errEl.scrollIntoView({behavior:'smooth', block:'nearest'});
      return;
    }
    errEl.classList.remove('visible');
    list.forEach(q => { if (vis(q)) ans[q.id] = o[q.id]; else delete ans[q.id]; });
    onNext();
    scrollTo({top:0, behavior:'smooth'});
  };
}

/* ── SCREENS ───────────────────────────────────────────────── */
function landing() {
  cat = null; ans = {};
  app.innerHTML = `<div class="page-enter">
    <div class="hero">
      <div class="hero-badge"><span>📊</span> Research Survey</div>
      <h1>Help Shape the Future of Investor Education</h1>
      <p>I'm building a tool that makes company reports accessible — through expert video walkthroughs and an AI assistant. Your honest experience (4 min, all taps) will directly shape what gets built.</p>
      <div class="hero-stats">
        <div class="stat"><strong>4 min</strong><span>To complete</span></div>
        <div class="stat"><strong>3</strong><span>Short sections</span></div>
        <div class="stat"><strong>100%</strong><span>Anonymous</span></div>
      </div>
      <button class="btn-primary" id="go" style="font-size:16px;padding:16px 40px">Start Survey →</button>
    </div>
  </div>`;
  document.getElementById("go").onclick = () => { stageCommon(); };
}

function stageCommon() {
  page({
    title: "A few quick questions",
    sublabel: "Step 1 of 3 · About You",
    list: COMMON, step: 0,
    label: "Next",
    onBack: landing,
    onNext: () => { cat = routeCat(ans); stageCat(); }
  });
}

function stageCat() {
  const c = CATS[cat];
  const switches = Object.entries(CATS).filter(([k])=>k!==cat).map(([k,v])=>
    `<button type="button" class="btn-small sw" data-k="${k}">${v.icon} ${esc(v.name)}</button>`
  ).join('');
  const note = `
    <div class="switch-row">
      <p>Based on your answers: <strong>${c.icon} ${esc(c.name)}</strong>. Not quite right?</p>
      ${switches}
    </div>`;
  page({
    title: `${c.icon} ${esc(c.name)}`,
    sublabel: "Step 2 of 3 · Your Experience",
    note, list: c.qs, step: 1,
    label: "Next",
    onBack: stageCommon,
    onNext: stagePrice
  });
  app.querySelectorAll(".sw").forEach(b => b.onclick = () => { cat = b.dataset.k; stageCat(); scrollTo({top:0,behavior:'smooth'}); });
}

function stagePrice() {
  page({
    title: "Almost done!",
    sublabel: "Step 3 of 3 · Pricing & Access",
    list: PRICE, step: 2,
    label: "Submit",
    onBack: stageCat,
    onNext: async () => {
      app.innerHTML = `<div class="saving-screen page-enter">
        <div class="spinner"></div>
        <div>
          <p style="font-weight:600;font-size:16px;margin-bottom:4px">Saving your response…</p>
          <p style="color:var(--tx3);font-size:13px">This takes just a second</p>
        </div>
      </div>`;
      const lists = [...COMMON, ...CATS[cat].qs, ...PRICE], a = {}, qs = {};
      lists.forEach(q => { if (ans[q.id] != null) { a[q.id] = ans[q.id]; qs[q.id] = q.t; } });
      const rec = { category: cat, time: new Date().toISOString(), answers: a, questions: qs };
      done(rec, await save(rec));
    }
  });
}

function done(rec, saved) {
  const txt = `Survey response (${CATS[rec.category].name})\n` +
    Object.entries(rec.answers).map(([k,v]) =>
      `${rec.questions[k]}\n-> ${Array.isArray(v) ? v.join(", ") : v || "(skipped)"}`
    ).join("\n\n");

  app.innerHTML = `<div class="thankyou page-enter">
    <div class="thankyou-icon">🎉</div>
    <h1>Thank you!</h1>
    ${saved
      ? `<div class="ok-msg">✓ Response saved to Google Sheets</div>`
      : `<p style="color:var(--err);margin-bottom:16px">Couldn't save automatically. Please copy and send your answers below.</p>
         <pre id="t">${esc(txt)}</pre>
         <button class="btn-primary" id="cp" style="margin:0 auto">Copy my answers</button>`
    }
    <p style="margin-top:20px">Your input will directly shape what gets built. I genuinely appreciate your time. 🙏</p>
  </div>`;

  const b = document.getElementById("cp");
  if (b) b.onclick = async () => {
    try {
      await navigator.clipboard.writeText(txt);
      b.textContent = "Copied ✓";
    } catch(e) {
      const r = document.createRange();
      r.selectNodeContents(document.getElementById("t"));
      getSelection().removeAllRanges();
      getSelection().addRange(r);
    }
  };
}

/* ── BOOT ──────────────────────────────────────────────────── */
landing();
</script>
</body>
</html>
